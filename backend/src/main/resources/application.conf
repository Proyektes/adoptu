env = "dev"
env = ${?ADOPTU_ENV}

ktor {
    deployment {
        port = 8080
        port = ${?ADOPTU_PORT}
    }
    application {
        modules = [ com.adoptu.ApplicationKt.module ]
    }
}

db {
    dev {
        postgres {
            driver = "org.postgresql.Driver"
            url = "jdbc:postgresql://localhost:5432/adoptu"
            user = "adoptu"
            password = "Ad0ptU"
        }
    }

    prod {
        postgres {
            driver = "org.postgresql.Driver"
            url = "jdbc:postgresql://localhost:5432/adoptu"
            url = ${?ADOPTU_DB_URL}
            user = "adoptu"
            user = ${?ADOPTU_DB_USER}
            password = "Ad0ptU"
            password = ${?ADOPTU_DB_PASSWORD}
        }
    }
}

storage {
    dev {
        bucket = "adoptu-pets"
        region = "us-east-1"
        endpoint = "http://localhost:4566"
        path_style_access = true
    }

    prod {
        bucket = "adoptu-pets"
        bucket = ${?ADOPTU_S3_BUCKET}
        region = "us-east-1"
        region = ${?ADOPTU_S3_REGION}
        endpoint = ${?ADOPTU_S3_ENDPOINT}
        path_style_access = false
        path_style_access = ${?ADOPTU_S3_PATH_STYLE_ACCESS}
        # The bucket blocks direct public access (its policy only allows the CloudFront
        # distribution) - URLs returned to clients must go through the CDN domain instead of a
        # raw S3 endpoint, or every image request 403s.
        public_url = ${?ADOPTU_S3_PUBLIC_URL}
    }
}

email {
    dev {
        host = "localhost"
        host = ${?SMTP_HOST}
        port = 1025
        port = ${?SMTP_PORT}
        username = ""
        username = ${?SMTP_USERNAME}
        password = ""
        password = ${?SMTP_PASSWORD}
        from = "noreply@adopt-u.org"
        from = ${?SMTP_FROM}
        starttls = false
        starttls = ${?SMTP_STARTTLS}
    }

    prod {
        host = "localhost"
        host = ${?SMTP_HOST}
        port = 587
        port = ${?SMTP_PORT}
        username = ${?SMTP_USERNAME}
        password = ${?SMTP_PASSWORD}
        from = "noreply@adopt-u.org"
        from = ${?SMTP_FROM}
        starttls = true
        starttls = ${?SMTP_STARTTLS}
    }
}

ses {
    region = "us-east-1"
    region = ${?AWS_REGION}
    endpoint = ${?AWS_SES_ENDPOINT}
}

admin {
    email = "adopt-u@adopt-u.org"
    email = ${?ADOPTU_ADMIN_EMAIL}
    username = ${?ADOPTU_ADMIN_USERNAME}
}

session {
    # Dev-only default (32+ bytes required) - every real deployment must override this via
    # ADOPTU_SESSION_SECRET, or every environment shares the same session-signing key.
    secretKey = "adoptu-dev-only-insecure-session-secret-change-me"
    secretKey = ${?ADOPTU_SESSION_SECRET}
}

webauthn {
    rpId = "localhost"
    rpId = ${?ADOPTU_WEB_AUTHN_RP_ID}
    rpName = "Adopt-U Pet Adoption"
    rpName = ${?ADOPTU_WEB_AUTHN_RP_NAME}
    # Comma-separated, not a HOCON list: ${?VAR} substitution from an
    # environment variable always produces a string, never a re-parsed
    # array, even if the value looks like JSON/HOCON array syntax - trying
    # to substitute into a list-typed slot throws
    # ConfigException.WrongType("has type STRING rather than LIST") at
    # first use. See getOrigins() in AppModule.kt for the split.
    #
    # :4000, not :8080 - passkey ceremonies run in the browser on whatever origin actually served
    # the page, and pages are the static site now (:frontend:serveSite locally, CloudFront/S3 in
    # prod - see infra/variables.tf's webauthn_origins), not the backend itself.
    origins = "http://localhost:4000"
    origins = ${?ADOPTU_WEB_AUTHN_ORIGINS}
}

# :4000, not :8080 - built into outbound email links (password reset, magic-link login, email/
# profile-email verification - see AuthRoutes.kt/AppModule.kt) that must point at the static site
# (:frontend:serveSite locally) where /reset-password, /verify etc. actually live now, not at the
# backend's own JSON-API-only origin.
baseUrl = "http://localhost:4000"
baseUrl = ${?ADOPTU_BASE_URL}

# Urgent-rescuer SMS paging (SnsSmsAdapter). No access-key/endpoint set in dev by default, so the
# client falls back to DefaultCredentialsProvider against the real AWS region - sends fail closed
# (SnsSmsAdapter logs and returns false rather than throwing) rather than requiring real AWS SNS
# access just to run the app locally.
sns {
    region = "us-east-1"
    region = ${?AWS_REGION}
    endpoint = ${?ADOPTU_SNS_ENDPOINT}
}

# CAPTCHA gate for anonymous urgent-report submissions (TurnstileCaptchaAdapter). Cloudflare
# publishes fixed test site/secret keys that always pass/fail, for local dev without a real
# Turnstile account - see https://developers.cloudflare.com/turnstile/troubleshooting/testing/.
turnstile {
    secretKey = "1x0000000000000000000000000000000AA"
    secretKey = ${?ADOPTU_TURNSTILE_SECRET_KEY}
}
